name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '11.0'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    name: Check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.96.0
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  package:
    name: Universal executable
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Install pinned Rust and both targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup override set 1.96.0
      - name: Build universal archive
        run: bash scripts/package-macos.sh
      - name: Verify extracted archive
        run: |
          cd dist
          shasum -a 256 -c switchbridge-macos-universal.tar.gz.sha256
          mkdir extracted
          tar -xzf switchbridge-macos-universal.tar.gz -C extracted
          cd extracted
          shasum -a 256 -c SHA256SUMS
          test -x switchbridge
          lipo switchbridge -verify_arch arm64 x86_64
          cat ../switchbridge-macos-universal.tar.gz.sha256 >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: switchbridge-macos-universal-${{ env.SOURCE_SHA }}
          path: |
            dist/switchbridge-macos-universal.tar.gz
            dist/switchbridge-macos-universal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Packaged smoke (${{ matrix.runner }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: switchbridge-macos-universal-${{ env.SOURCE_SHA }}
          path: downloaded
      - name: Verify and execute packaged binary natively
        run: |
          cd downloaded
          shasum -a 256 -c switchbridge-macos-universal.tar.gz.sha256
          tar -xzf switchbridge-macos-universal.tar.gz
          shasum -a 256 -c SHA256SUMS
          test -x switchbridge
          lipo switchbridge -verify_arch arm64 x86_64
          python3 ../scripts/smoke-packaged-macos.py ./switchbridge
